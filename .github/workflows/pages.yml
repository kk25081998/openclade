name: Publish app
# Builds OpenClade, runs the test suite, and publishes the app with GitHub
# Pages (served at https://kartikkhosa.com/openclade/). Nothing is published
# unless every test passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch published example matrices (TreeSearch package datasets)
        run: git clone --depth 1 https://github.com/ms609/TreeSearch datasets/TreeSearch
      - run: npm install
      - name: Core tests
        run: npm test
      - name: Build
        env:
          DATASETS: datasets/TreeSearch/inst/datasets
        run: npm run build
      - name: End-to-end page test
        run: npm run test:ui
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          cp -r dist/docs _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
